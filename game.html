      body {
        display: flex;

        margin: 0;

        justify-content: center;
        align-items: center;
        gap: 20px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(18, minmax(15px, 30px));
        grid-template-rows: repeat(18, minmax(15px, 30px));
        gap: 2px;
        margin: 5px 0;
      }

      .grid-cell {
        width: 100%;
        height: 100%;
        border: 1px solid transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        background-color: #4682b4; /* Undiscovered: blue */
      }

      .revealed {
        background-color: rgba(34, 139, 34, var(--opacity)); /* Revealed: topographical map */
      }

      .highlight-center {
        background-color: #ffa07a !important; /* Highlight for the center */
      }

      .highlight-neighbor {
        background-color: #ffd700 !important; /* Highlight for neighbors */
      }

      .details {
        font-size: 16px;
        background-color: #ffffff;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
        text-align: center;
      }

      .cross {
        display: grid;
        grid-template-rows: repeat(3, minmax(30px, 50px));
        grid-template-columns: repeat(3, minmax(30px, 50px));
        gap: 5px;
        justify-content: center;
        align-items: center;
        margin-top: 5px;
      }

      .cross-cell {
        width: 100%;
        height: 100%;
        background-color: #d3d3d3;
        border: 1px solid #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
      }

      .cross-empty {
        background-color: transparent;
        border: none;
      }

      .cross-center {
        background-color: #ffa07a;
      }

      .button {
        margin-top: 10px;
        padding: 10px 20px;
        font-size: 14px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .button:hover {
        background-color: #0056b3;
      }

      @media (max-width: 1000px) {
        body {
          flex-direction: column; /* Stack vertically on small screens */
          align-items: center;
        }

        .grid {
          grid-template-columns: repeat(18, 1fr); /* Distribute columns evenly */
          grid-template-rows: repeat(18, 1fr); /* Distribute rows evenly */

          height: 90vw; /* Make grid height equal to its width (square) */

        }

        .grid-cell {

          height: 100%;
        }

        .cross {

        .cross-cell {

        }

        .button {

        }
      }

iv class="grid-cell" data-row="17" data-col="15" data-elevation="32" style="--opacity: 0.62;"></div><div class="grid-cell" data-row="17" data-col="16" data-elevation="24" style="--opacity: 0.54;"></div><div class="grid-cell" data-row="17" data-col="17" data-elevation="6" style="--opacity: 0.36;"></div></div>

<button id="hint" class="button">Robot Hint</button>
<div style="display: 'flex'; flex-direction:'column'">
<button id="run" class="button">Robot Solve</button>
<div class="slidecontainer">
<input type="range" min="1" max="1000"value="50" class="slider" id="myRange">
<p>Speed: <span id="demo"></span></p>

    <script>
      const gridSize = 18;
      const noise = new SimplexNoise();
      const scale = 0.1;
      let clickCount = 0;
      let peakRow, peakCol, highestPoint, gridHeights;
let solved = false;
let lastClickedRow = 0;
let lastClickedCol = 0;

      const grid = document.querySelector(".grid");
      const scoreElement = document.getElementById("score");

      function generateGrid() {
	lastClickedRow = 0;
lastClickedCol = 0;
	solved = false;
        // Update cross details
        document.getElementById("top-cell").textContent = "--";
        document.getElementById("center-left-cell").textContent =  "--";
        document.getElementById("center-cell").textContent = "--";
        document.getElementById("center-right-cell").textContent = "--"
        document.getElementById("bottom-cell").textContent = "--";

	document.getElementById("history").innerHTML = "";
        clickCount = 0;
        scoreElement.textContent = "Clicks: 0";

        grid.innerHTML = ""; // Clear the grid

        peakRow = Math.floor(Math.random() * gridSize);
        peakCol = Math.floor(Math.random() * gridSize);

        gridHeights = Array.from({ length: gridSize }, (_, y) =>
          Array.from({ length: gridSize }, (_, x) => {
            const noiseValue = noise.noise2D(x * scale, y * scale);
            const distanceFromPeak = Math.sqrt((x - peakCol) ** 2 + (y - peakRow) ** 2);
            const radialFalloff = Math.max(0, 1 - distanceFromPeak / (gridSize / 2));
            return Math.floor((noiseValue + radialFalloff) * 50);
          })
        );

        highestPoint = { row: 0, col: 0, value: -Infinity };
        gridHeights.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value > highestPoint.value) {
              highestPoint = { row: y, col: x, value };
            }
          });
        });

        for (let y = 0; y < gridSize; y++) {
          for (let x = 0; x < gridSize; x++) {
            const cell = document.createElement("div");
            const elevation = gridHeights[y][x];
            cell.classList.add("grid-cell");
            cell.dataset.row = y;
            cell.dataset.col = x;
            cell.dataset.elevation = elevation;
            cell.style.setProperty("--opacity", 0.3 + elevation / 100);
            cell.addEventListener("click", () => handleGridClick(y, x));
            grid.appendChild(cell);
          }
        }
      }

      function handleGridClick(row, col, isRobot = false) {
lastClickedRow = row;
lastClickedCol = col;
        clickCount++;
        scoreElement.textContent = `Clicks: ${clickCount}`;
        const centerCell = document.querySelector(`.grid-cell[data-row="${row}"][data-col="${col}"]`);
        const topCell = row > 0 ? document.querySelector(`.grid-cell[data-row="${row - 1}"][data-col="${col}"]`) : null;
        const bottomCell = row < gridSize - 1 ? document.querySelector(`.grid-cell[data-row="${row + 1}"][data-col="${col}"]`) : null;
        const leftCell = col > 0 ? document.querySelector(`.grid-cell[data-row="${row}"][data-col="${col - 1}"]`) : null;
        const rightCell = col < gridSize - 1 ? document.querySelector(`.grid-cell[data-row="${row}"][data-col="${col + 1}"]`) : null;



        if (centerCell) {centerCell.classList.add("revealed"); centerCell.innerHTML = centerCell.dataset.elevation;}
        if (topCell) {topCell.classList.add("revealed"); topCell.innerHTML = topCell.dataset.elevation;}
        if (bottomCell) {bottomCell.classList.add("revealed"); bottomCell.innerHTML = bottomCell.dataset.elevation;}
        if (leftCell) {leftCell.classList.add("revealed"); leftCell.innerHTML = leftCell.dataset.elevation;}
        if (rightCell) {rightCell.classList.add("revealed"); rightCell.innerHTML = rightCell.dataset.elevation;}

	// Add history
	const move = document.createElement("div");
	move.innerHTML = isRobot ? `Robot ${row},${col}` : `Clicked ${row},${col}`
	document.getElementById("history").appendChild(move)

        // Update cross details
        document.getElementById("top-cell").textContent = topCell ? gridHeights[row - 1][col] : "--";
        document.getElementById("center-left-cell").textContent = leftCell ? gridHeights[row][col - 1] : "--";
        document.getElementById("center-cell").textContent = gridHeights[row][col];
        document.getElementById("center-right-cell").textContent = rightCell ? gridHeights[row][col + 1] : "--";
        document.getElementById("bottom-cell").textContent = bottomCell ? gridHeights[row + 1][col] : "--";

        document.querySelectorAll(".highlight-center, .highlight-neighbor").forEach((cell) => {
          cell.classList.remove("highlight-center", "highlight-neighbor");
        });
        if (centerCell) centerCell.classList.add("highlight-center");

        if (row === highestPoint.row && col === highestPoint.col) {
          solved = true;
          alert(`You Win! Found the highest point (${highestPoint.value}) in ${clickCount} clicks.`);
          document.querySelectorAll(".grid-cell").forEach((cell) => {
	cell.classList.add("revealed");
	cell.innerHTML = cell.dataset.elevation;
	
});
	  //document.getElementById("history").innerHTML = "";
        }
      }

      document.getElementById("reset-button").addEventListener("click", generateGrid);

      generateGrid();

function randomIntFromInterval(min, max) { // min and max included 
  return Math.floor(Math.random() * (max - min + 1) + min);
}


function getRobotClickData(row, col){
        const centerCell = document.querySelector(`.grid-cell[data-row="${row}"][data-col="${col}"]`);
        const topCell = row > 0 ? document.querySelector(`.grid-cell[data-row="${row - 1}"][data-col="${col}"]`) : null;
        const bottomCell = row < gridSize - 1 ? document.querySelector(`.grid-cell[data-row="${row + 1}"][data-col="${col}"]`) : null;
        const leftCell = col > 0 ? document.querySelector(`.grid-cell[data-row="${row}"][data-col="${col - 1}"]`) : null;
        const rightCell = col < gridSize - 1 ? document.querySelector(`.grid-cell[data-row="${row}"][data-col="${col + 1}"]`) : null;

	const centerElevation = centerCell ? centerCell.dataset.elevation : -100;
	const bottomElevation = bottomCell ? bottomCell.dataset.elevation : -100;
const leftElevation = leftCell ? leftCell.dataset.elevation : -100;
const rightElevation = rightCell ? rightCell.dataset.elevation : -100;
const topElevation = topCell ? topCell.dataset.elevation : -100;

	return [topElevation, bottomElevation, centerElevation, leftElevation, rightElevation]

}
function sleep(ms) {
return new Promise(resolve => setTimeout(resolve, ms));
}

async function robot(currentRow, currentCol, speed = 100) {
  let checked = new Set();


  handleGridClick(currentRow, currentCol, true);  // Make the initial move

  // Loop until the robot finds the highest point
  while (!solved) {
    let foundHigher = false; // Flag to track if we find a higher neighbor

    // Keep checking from the current cell or random new positions
    while (!foundHigher && !solved) {
      // Get the current cell's elevation and its neighbors' elevation data
      const [top, bottom, center, left, right] = getRobotClickData(currentRow, currentCol);
      
      // Find the neighbor with the highest elevation
      const neighbors = [
        { row: currentRow - 1, col: currentCol, elevation: top },    // top
        { row: currentRow + 1, col: currentCol, elevation: bottom }, // bottom
        { row: currentRow, col: currentCol, elevation: center },    // center
        { row: currentRow, col: currentCol - 1, elevation: left },  // left
        { row: currentRow, col: currentCol + 1, elevation: right }  // right
      ];

      // Filter out invalid neighbors (those that are outside the grid)
      const validNeighbors = neighbors.filter(neighbor => 
        neighbor.row >= 0 && neighbor.row < gridSize && 
        neighbor.col >= 0 && neighbor.col < gridSize
      );

      // Find the neighbor with the highest elevation
      let maxNeighbor = validNeighbors.reduce((max, neighbor) => {
        return neighbor.elevation > max.elevation ? neighbor : max;
      }, { elevation: -Infinity });

      // If no neighbor has a higher elevation than the current cell, restart
      if (maxNeighbor.elevation <= center) {
        // Mark this local max and try a new random starting position
        currentRow = randomIntFromInterval(0, gridSize - 1);
        currentCol = randomIntFromInterval(0, gridSize - 1);
        handleGridClick(currentRow, currentCol, true);  // Click the new random position
        foundHigher = false; // Continue searching
        await sleep(speed);//se before trying again
      } else {
        // Move to the cell with the highest elevation
        currentRow = maxNeighbor.row;
        currentCol = maxNeighbor.col;
        handleGridClick(currentRow, currentCol, true);  // Click the new cell
        foundHigher = true; // We found a better elevation, so continue searching
        await sleep(speed);//se for a bit before making the next move
      }
    }
  }
}

var slider = document.getElementById("myRange");
var output = document.getElementById("demo");

    document.getElementById("run").addEventListener("click", () => robot(lastClickedRow, lastClickedCol, output));
document.getElementById("hint").addEventListener("click", () => robot(lastClickedRow, lastClickedCol, output));


output.innerHTML = slider.value; // Display the default slider value

// Update the current slider value (each time you drag the slider handle)
slider.oninput = function() {
output.innerHTML = this.value;
}


    </script>
