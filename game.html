<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Topographical Elevation Game</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>
    <style>
      body {
        display: flex;
        flex-direction: row;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 5px;
        background-color: #f5f5f5;
        justify-content: center;
        align-items: center;
        gap: 20px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(18, minmax(15px, 30px));
        grid-template-rows: repeat(18, minmax(15px, 30px));
        gap: 2px;
        margin: 5px 0;
      }

      .grid-cell {
        width: 100%;
        height: 100%;
        border: 1px solid transparent;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        background-color: #4682b4; /* Undiscovered: blue */
      }

      .revealed {
        background-color: rgba(34, 139, 34, var(--opacity)); /* Revealed: topographical map */
      }

      .highlight-center {
        background-color: #ffa07a !important; /* Highlight for the center */
      }

      .highlight-neighbor {
        background-color: #ffd700 !important; /* Highlight for neighbors */
      }

      .details {
        font-size: 16px;
        background-color: #ffffff;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 500px;
        text-align: center;
      }

      .cross {
        display: grid;
        grid-template-rows: repeat(3, minmax(30px, 50px));
        grid-template-columns: repeat(3, minmax(30px, 50px));
        gap: 5px;
        justify-content: center;
        align-items: center;
        margin-top: 5px;
      }

      .cross-cell {
        width: 100%;
        height: 100%;
        background-color: #d3d3d3;
        border: 1px solid #ccc;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 12px;
        font-weight: bold;
      }

      .cross-empty {
        background-color: transparent;
        border: none;
      }

      .cross-center {
        background-color: #ffa07a;
      }

      .button {
        margin-top: 10px;
        padding: 10px 20px;
        font-size: 14px;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }

      .button:hover {
        background-color: #0056b3;
      }

      @media (max-width: 1000px) {
        body {
          flex-direction: column; /* Stack vertically on small screens */
          align-items: center;
        }

        .grid {
          grid-template-columns: repeat(18, 1fr); /* Distribute columns evenly */
          grid-template-rows: repeat(18, 1fr); /* Distribute rows evenly */
          width: 90vw; /* Make grid take up 90% of the viewport width */
          height: 90vw; /* Make grid height equal to its width (square) */
          margin: 0;
        }

        .grid-cell {
          width: 100%; /* Cell size adapts to the grid's calculated size */
          height: 100%;
        }

        .cross {
          grid-template-rows: repeat(3, minmax(30px, 40px));
          grid-template-columns: repeat(3, minmax(30px, 40px));
        }

        .cross-cell {
          font-size: 10px; /* Adjust font size to fit smaller cells */
        }

        .button {
          font-size: 12px;
          padding: 8px 15px;
        }
      }
    </style>
  </head>
  <body>
    <div class="details">
      <h2>Find the Highest Point</h2>
      <p id="score">Clicks: 0</p>
      <button id="reset-button" class="button">Reset Game</button>
      <div class="cross">
        <div class="cross-cell cross-empty"></div>
        <div class="cross-cell" id="top-cell">--</div>
        <div class="cross-cell cross-empty"></div>
        <div class="cross-cell" id="center-left-cell">--</div>
        <div class="cross-cell cross-center" id="center-cell">--</div>
        <div class="cross-cell" id="center-right-cell">--</div>
        <div class="cross-cell cross-empty"></div>
        <div class="cross-cell" id="bottom-cell">--</div>
        <div class="cross-cell cross-empty"></div>
      </div>
    </div>

    <div class="grid"></div>

    <script>
      const gridSize = 18;
      const noise = new SimplexNoise();
      const scale = 0.1;
      let clickCount = 0;
      let peakRow, peakCol, highestPoint, gridHeights;

      const grid = document.querySelector(".grid");
      const scoreElement = document.getElementById("score");

      function generateGrid() {
        clickCount = 0;
        scoreElement.textContent = "Clicks: 0";

        grid.innerHTML = ""; // Clear the grid

        peakRow = Math.floor(Math.random() * gridSize);
        peakCol = Math.floor(Math.random() * gridSize);

        gridHeights = Array.from({ length: gridSize }, (_, y) =>
          Array.from({ length: gridSize }, (_, x) => {
            const noiseValue = noise.noise2D(x * scale, y * scale);
            const distanceFromPeak = Math.sqrt((x - peakCol) ** 2 + (y - peakRow) ** 2);
            const radialFalloff = Math.max(0, 1 - distanceFromPeak / (gridSize / 2));
            return Math.floor((noiseValue + radialFalloff) * 50);
          })
        );

        highestPoint = { row: 0, col: 0, value: -Infinity };
        gridHeights.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value > highestPoint.value) {
              highestPoint = { row: y, col: x, value };
            }
          });
        });

        for (let y = 0; y < gridSize; y++) {
          for (let x = 0; x < gridSize; x++) {
            const cell = document.createElement("div");
            const elevation = gridHeights[y][x];
            cell.classList.add("grid-cell");
            cell.dataset.row = y;
            cell.dataset.col = x;
            cell.dataset.elevation = elevation;
            cell.style.setProperty("--opacity", 0.3 + elevation / 100);
            cell.addEventListener("click", () => handleGridClick(y, x));
            grid.appendChild(cell);
          }
        }
      }

      function handleGridClick(row, col) {
        clickCount++;
        scoreElement.textContent = `Clicks: ${clickCount}`;
        const centerCell = document.querySelector(`.grid-cell[data-row="${row}"][data-col="${col}"]`);
        const topCell = row > 0 ? document.querySelector(`.grid-cell[data-row="${row - 1}"][data-col="${col}"]`) : null;
        const bottomCell = row < gridSize - 1 ? document.querySelector(`.grid-cell[data-row="${row + 1}"][data-col="${col}"]`) : null;
        const leftCell = col > 0 ? document.querySelector(`.grid-cell[data-row="${row}"][data-col="${col - 1}"]`) : null;
        const rightCell = col < gridSize - 1 ? document.querySelector(`.grid-cell[data-row="${row}"][data-col="${col + 1}"]`) : null;

        if (centerCell) centerCell.classList.add("revealed");
        if (topCell) topCell.classList.add("revealed");
        if (bottomCell) bottomCell.classList.add("revealed");
        if (leftCell) leftCell.classList.add("revealed");
        if (rightCell) rightCell.classList.add("revealed");

        // Update cross details
        document.getElementById("top-cell").textContent = topCell ? gridHeights[row - 1][col] : "--";
        document.getElementById("center-left-cell").textContent = leftCell ? gridHeights[row][col - 1] : "--";
        document.getElementById("center-cell").textContent = gridHeights[row][col];
        document.getElementById("center-right-cell").textContent = rightCell ? gridHeights[row][col + 1] : "--";
        document.getElementById("bottom-cell").textContent = bottomCell ? gridHeights[row + 1][col] : "--";

        document.querySelectorAll(".highlight-center, .highlight-neighbor").forEach((cell) => {
          cell.classList.remove("highlight-center", "highlight-neighbor");
        });
        if (centerCell) centerCell.classList.add("highlight-center");

        if (row === highestPoint.row && col === highestPoint.col) {
          alert(`You Win! Found the highest point (${highestPoint.value}) in ${clickCount} clicks.`);
          document.querySelectorAll(".grid-cell").forEach((cell) => cell.classList.add("revealed"));
        }
      }

      document.getElementById("reset-button").addEventListener("click", generateGrid);

      generateGrid();
    </script>
  </body>
</html>
